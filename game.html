<!DOCTYPE html>
<html>
<head>
<title>Easypesa</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0b0f1c,#1a2338,#0b0f1c);
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* LOGIN SCREEN */

#loginScreen{
position:absolute;
width:100%;
height:100%;
background:#0b0f1c;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
}

#loginScreen input{
padding:12px;
font-size:16px;
border-radius:6px;
border:none;
margin-bottom:10px;
}

#loginScreen button{
padding:12px 25px;
background:#22c55e;
border:none;
border-radius:6px;
color:white;
font-weight:bold;
cursor:pointer;
}

/* top buttons */

.top-buttons{
position:absolute;
top:20px;
right:20px;
display:flex;
gap:12px;
z-index:5;
}

.top-buttons button{
background:#22c55e;
border:none;
padding:12px 18px;
border-radius:8px;
color:white;
font-weight:bold;
font-size:14px;
cursor:pointer;
}

.bg-boxes{
position:absolute;
width:100%;
height:100%;
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(3,1fr);
gap:25px;
padding:40px;
z-index:0;
}

.bg-box{
background:rgba(255,255,255,0.05);
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
color:rgba(255,255,255,0.07);
}

.center{
position:relative;
z-index:2;
text-align:center;
width:650px;
}

.logo{
font-size:40px;
color:#ff3b3b;
margin-bottom:20px;
}

.history{
display:flex;
gap:8px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:15px;
}

.history span{
background:#111827;
padding:6px 10px;
border-radius:6px;
font-size:13px;
color:#22c55e;
}

.gamebox{
background:rgba(0,0,0,0.5);
padding:50px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
margin-bottom:20px;
}

#multiplier{
font-size:70px;
color:#00ffcc;
}

/* EASY AREA */

.easy-container{
display:flex;
justify-content:center;
gap:40px;
margin-bottom:20px;
}

.easy-row{
display:flex;
align-items:center;
gap:10px;
}

.easy-btn{
background:#22c55e;
border:none;
padding:12px 35px;
border-radius:8px;
color:white;
font-weight:bold;
font-size:16px;
min-width:150px;
}

.adjust{
font-size:28px;
cursor:pointer;
user-select:none;
}

/* cashout */

.cashout{
background:#ff3b3b;
border:none;
padding:15px 35px;
font-size:20px;
border-radius:8px;
cursor:pointer;
color:white;
}

</style>
</head>

<body>

<div id="loginScreen">
<h2>Login to Easypesa</h2>
<input type="text" id="username" placeholder="Enter your name">
<button onclick="login()">Login</button>
</div>

<div class="top-buttons">
<button id="account">My Account</button>
<button>Deposit</button>
<button>Withdraw</button>
</div>

<div class="bg-boxes">

<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>

<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>

<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>
<div class="bg-box">EASYPESA</div>

</div>

<div class="center">

<h1 class="logo">EASYPESA</h1>

<div class="history" id="history"></div>

<div class="gamebox">
<h2 id="multiplier">1.00x</h2>
</div>

<div class="easy-container">

<div class="easy-row">
<span class="adjust" onclick="changeBet(1,-20)">−</span>
<button class="easy-btn" id="easy1">EASY 20 KES</button>
<span class="adjust" onclick="changeBet(1,20)">+</span>
</div>

<div class="easy-row">
<span class="adjust" onclick="changeBet(2,-20)">−</span>
<button class="easy-btn" id="easy2">EASY 20 KES</button>
<span class="adjust" onclick="changeBet(2,20)">+</span>
</div>

</div>

<button class="cashout" onclick="crashGame()">Cashout</button>

</div>

<script>

let multiplier = 1.00
let running = true
let gameInterval
let history = []

let balance = 10000
let easy1 = 20
let easy2 = 20

let playerName = ""

function login(){

playerName = document.getElementById("username").value

if(playerName===""){
alert("Enter name")
return
}

document.getElementById("loginScreen").style.display="none"

updateAccount()

}

function updateAccount(){
document.getElementById("account").innerText =
playerName + " | " + balance + " KES"
}

function changeBet(box,amount){

if(box===1){
easy1 += amount
if(easy1 < 20) easy1 = 20
document.getElementById("easy1").innerText="EASY "+easy1+" KES"
}

if(box===2){
easy2 += amount
if(easy2 < 20) easy2 = 20
document.getElementById("easy2").innerText="EASY "+easy2+" KES"
}

}

function startGame(){

running = true
multiplier = 1.00

gameInterval=setInterval(()=>{

if(running){

multiplier+=0.01
document.getElementById("multiplier").innerText =
multiplier.toFixed(2)+"x"

}

},50)

}

function crashGame(){

if(!running) return

running=false
clearInterval(gameInterval)

let crashValue=multiplier

balance -= (easy1 + easy2)

let win = (easy1*crashValue)+(easy2*crashValue)

balance += Math.floor(win)

updateAccount()

addHistory(crashValue.toFixed(2)+"x")

document.getElementById("multiplier").innerText="CRASHED"

startCountdown()

}

function addHistory(value){

history.unshift(value)

if(history.length>10) history.pop()

let historyBox=document.getElementById("history")
historyBox.innerHTML=""

history.forEach(h=>{
let span=document.createElement("span")
span.innerText=h
historyBox.appendChild(span)
})

}

function startCountdown(){

let count=5

let countdown=setInterval(()=>{

document.getElementById("multiplier").innerText =
"Restarting "+count

count--

if(count<0){
clearInterval(countdown)
startGame()
}

},1000)

}

startGame()

</script>

</body>
</html>
